description: Sonatype Nexus Repository 3
server:
  file: server.yaml.hbs
  values:
    type: object
    additionalProperties: false
    properties:
      connect-timeout:
        description: How long to wait for a connection, such as 30 or "2 min"; a bare number is seconds.
        oneOf:
          - type: number
            minimum: 0
            maximum: 31536000
          - type: string
            maxLength: 100
      request-timeout:
        description: How long to wait for a whole request, such as 30 or "2 min"; a bare number is seconds.
        oneOf:
          - type: number
            minimum: 0
            maximum: 31536000
          - type: string
            maxLength: 100
      maximum-concurrent-downloads:
        description: The most downloads from this server at once.
        type: integer
        minimum: 1
        maximum: 100
      maximum-concurrent-uploads:
        description: The most uploads to this server at once.
        type: integer
        minimum: 1
        maximum: 100
repositories:
  maven2:
    file: maven2.yaml.hbs
    roles: [source, target, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        max-listing-rows:
          description: The most rows one paged listing reads before giving up; raise it for a repository holding years of builds.
          type: integer
          minimum: 1
          default: 10000
  npm:
    file: npm.yaml.hbs
    roles: [source, target, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        max-listing-rows:
          description: The most rows one paged listing reads before giving up; raise it for a repository holding years of builds.
          type: integer
          minimum: 1
          default: 10000
  pypi:
    file: pypi.yaml.hbs
    roles: [source, target, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        legacy-dists:
          description: How to manage legacy distributions.
          enum: ["error", "skip", "guess"]
          default: error
        max-listing-rows:
          description: The most rows one paged listing reads before giving up; raise it for a repository holding years of builds.
          type: integer
          minimum: 1
          default: 10000
  raw:
    file: raw.yaml.hbs
    roles: [source, target, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        mapping:
          description: How raw paths become artifacts.
          enum: [directory, as-is, name-version-file]
          default: directory
        overwrite-guard:
          description: Who keeps a written path from being replaced; "check" compares before writing, for a repository with writePolicy ALLOW.
          enum: [server, check]
          default: server
        upload-group-size:
          description: The most one upload request carries, such as "50 MiB"; a larger file goes alone.
          type: [string, integer]
          default: 50 MiB
        max-listing-rows:
          description: The most rows one paged listing reads before giving up; raise it for a repository holding years of builds.
          type: integer
          minimum: 1
          default: 10000
