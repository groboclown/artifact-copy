description: JFrog Artifactory OSS
server:
  file: server.yaml.hbs
  values:
    type: object
    additionalProperties: false
    properties:
      connect-timeout:
        description: How long to wait for a connection, such as 30 or "2 min"; a bare number is seconds.
        oneOf:
          - type: number
            minimum: 0
            maximum: 31536000
          - type: string
            maxLength: 100
      request-timeout:
        description: How long to wait for a whole request, such as 30 or "2 min"; a bare number is seconds.
        oneOf:
          - type: number
            minimum: 0
            maximum: 31536000
          - type: string
            maxLength: 100
      maximum-concurrent-downloads:
        description: The most downloads from this server at once.
        type: integer
        minimum: 1
        maximum: 100
      maximum-concurrent-uploads:
        description: The most uploads to this server at once.
        type: integer
        minimum: 1
        maximum: 100
repositories:
  maven:
    file: maven.yaml.hbs
    roles: [source, target, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        anonymous:
          description: Attempt to enumerate the values using anonymous access.
          enum: ["attempt", null]
          default: null
  generic:
    file: generic.yaml.hbs
    roles: [source, target, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        mapping:
          description: How raw paths become artifacts.
          enum: [directory, as-is, name-version-file]
          default: directory
        overwrite-guard:
          description: Who keeps a written path from being replaced; "check" compares before writing, since a deploy with overwrite permission replaces silently.
          enum: [server, check]
          default: check
        anonymous:
          description: Attempt to enumerate the values using anonymous access.
          enum: ["attempt", null]
          default: null
  ivy:
    file: ivy.yaml.hbs
    roles: [source, enumerator]
    values:
      type: object
      additionalProperties: false
      properties:
        mapping:
          description: How raw paths become artifacts.
          enum: [directory, as-is, name-version-file]
          default: name-version-file
        anonymous:
          description: Attempt to enumerate the values using anonymous access.
          enum: ["attempt", null]
          default: null
