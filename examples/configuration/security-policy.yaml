$schema: https://github.com/groboclown/artifact-copy/schema/security-policy.schema.json

# Malware is never migrated.  Vulnerabilities are reported rather than
# blocked, because nearly every real dependency graph carries some.
#
# Allowances for specific artifacts are VEX statements, which arrive with
# the request rather than here.  These come in through an OpenVEX or
# CycloneDX document with the --lock argument.

malware: forbid
vulnerabilities: report
