[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "am-python-echo"
version = "1.0"
description = "Minimal package for local artifact-server tests"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
publish = [
    "build>=1.2",
    "twine>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
