<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="sans-serif" font-size="13">
  <title>How observations reach the report, the log, and the progress bars</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>

  <g fill="#f6f8fa" stroke="#333" stroke-width="1.2">
    <rect x="20" y="30" width="170" height="50" rx="6"/>
    <rect x="230" y="30" width="170" height="50" rx="6"/>
    <rect x="440" y="30" width="180" height="50" rx="6"/>
    <rect x="680" y="30" width="200" height="50" rx="6"/>
    <rect x="230" y="130" width="170" height="50" rx="6"/>
    <rect x="20" y="230" width="170" height="50" rx="6"/>
    <rect x="440" y="230" width="180" height="50" rx="6"/>
    <rect x="680" y="230" width="200" height="60" rx="6"/>
    <rect x="20" y="350" width="170" height="50" rx="6"/>
    <rect x="440" y="350" width="180" height="50" rx="6"/>
    <rect x="680" y="350" width="200" height="50" rx="6"/>
  </g>

  <g fill="#111" text-anchor="middle">
    <text x="105" y="60">sub-commands</text>
    <text x="315" y="60">commands::ToReport</text>
    <text x="530" y="60" font-weight="bold">report::Logged</text>
    <text x="780" y="52">inner report</text>
    <text x="780" y="70" font-size="11">JSON Lines, text, SQLite</text>
    <text x="315" y="160">ProblemSink</text>
    <text x="105" y="252">call sites</text>
    <text x="105" y="270" font-size="11">ctx.log()</text>
    <text x="530" y="260" font-weight="bold">core::log::Log</text>
    <text x="780" y="255">cli::logging subscriber</text>
    <text x="780" y="273" font-size="11">filter + output, both reloadable</text>
    <text x="105" y="372">progress nodes</text>
    <text x="105" y="390" font-size="11">ctx.progress()</text>
    <text x="530" y="380">cli::progress::Bars</text>
    <text x="780" y="380">terminal (stderr)</text>
  </g>

  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="55" x2="230" y2="55"/>
    <line x1="400" y1="55" x2="440" y2="55"/>
    <line x1="620" y1="55" x2="680" y2="55"/>
    <line x1="400" y1="150" x2="470" y2="80"/>
    <line x1="530" y1="80" x2="530" y2="230"/>
    <line x1="190" y1="255" x2="440" y2="255"/>
    <line x1="620" y1="255" x2="680" y2="255"/>
    <line x1="190" y1="375" x2="440" y2="375"/>
    <line x1="620" y1="375" x2="680" y2="375"/>
  </g>

  <line x1="700" y1="290" x2="620" y2="360" stroke="#333" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <g fill="#444" font-size="11">
    <text x="626" y="48">unchanged</text>
    <text x="446" y="126">saw</text>
    <text x="540" y="150">each record and</text>
    <text x="540" y="164">state call, at its level</text>
    <text x="626" y="248">tracing</text>
    <text x="780" y="308" text-anchor="middle">stderr | stdout | file</text>
    <text x="250" y="368">ProgressSink</text>
    <text x="640" y="330" text-anchor="end">suspends bars while a</text>
    <text x="640" y="344" text-anchor="end">terminal line prints</text>
  </g>
</svg>
