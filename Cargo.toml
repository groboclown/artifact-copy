[package]
name = "artifact-copy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
# Not the default `rustls` feature: it adds the legacy hyper 0.14 client on
# rustls 0.21, beside the rustls 0.23 that `default-https-client` and reqwest use.
aws-sdk-secretsmanager = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
handlebars = "6.4.4"
hex = "0.4.3"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
jsonschema = { version = "0.56.0", default-features = false }
md-5 = "0.11.0"
nodejs-semver = "5.0.0"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
pgp = "0.20.0"
quick-xml = "0.38"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "stream", "http2", "charset", "json", "multipart", "system-proxy"] }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_norway = "0.9.42"
sha1 = "0.11.0"
sha2 = "0.11.0"
sigstore-trust-root = "0.14.0"
sigstore-verify = "0.14.0"
spdx = "0.13.5"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "async", "runtime", "std"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p1"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = "0.8"
wat = "1.263.0"

# Embedder examples, one per way of driving the library. See
# docs/embedding-guide.md.
[[example]]
name = "embedder-copy"
path = "examples/embedder/copy.rs"
